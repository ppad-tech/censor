[package]
name = "censor-rs-fastcrypto"
version = "0.1.0"
edition = "2021"
publish = false
description = "FFI bridge to fastcrypto::secp256r1::sign for censor-demo-ffi."

[lib]
name = "censor_rs_fastcrypto"
crate-type = ["staticlib"]

[dependencies]
fastcrypto = { git = "https://github.com/MystenLabs/fastcrypto", rev = "df2bc98edb29834757befc3e71e9ca646690948e" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
